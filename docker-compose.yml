services:
  mariadb:
    image: mariadb:11.4
    container_name: omnieye_mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-}
      MARIADB_ROOT_PASSWORD_FILE: ${MARIADB_ROOT_PASSWORD_FILE:-}
      MARIADB_DATABASE: ${DB_NAME:-omnieye_db}
      MARIADB_USER: ${DB_USER:-omnieye_user}
      MARIADB_PASSWORD: ${DB_PASSWORD:-}
      MARIADB_PASSWORD_FILE: ${MARIADB_PASSWORD_FILE:-}
    ports:
      - "127.0.0.1:${DB_PORT_HOST:-3306}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./docker/mariadb/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          if [ -n "$${MARIADB_PASSWORD_FILE}" ]; then
          mariadb_password=$$(cat "$${MARIADB_PASSWORD_FILE}");
          else mariadb_password="$${MARIADB_PASSWORD}"; fi;
          mariadb-admin ping -h localhost -u"$${MARIADB_USER}" -p"$$mariadb_password"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - omnieye_network

  redis:
    image: redis:7.2-alpine
    container_name: omnieye_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT_HOST:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - omnieye_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: omnieye_backend
    restart: unless-stopped
    environment:
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_USER: ${DB_USER:-omnieye_user}
      DB_PASSWORD: ${DB_PASSWORD:-}
      DB_PASSWORD_FILE: ${DB_PASSWORD_FILE:-}
      DB_NAME: ${DB_NAME:-omnieye_db}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      VAULT_SECRET_KEY: ${VAULT_SECRET_KEY:-}
      VAULT_SECRET_KEY_FILE: ${VAULT_SECRET_KEY_FILE:-}
      SECRET_KEY: ${SECRET_KEY:-}
      SECRET_KEY_FILE: ${SECRET_KEY_FILE:-}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      AD_MOCK_MODE: ${AD_MOCK_MODE:-true}
      AD_SERVER: ${AD_SERVER:-ldaps://localhost}
      AD_DOMAIN: ${AD_DOMAIN:-}
      AD_BASE_DN: ${AD_BASE_DN:-}
      AD_USE_SSL: ${AD_USE_SSL:-true}
      AD_GROUP_ADMIN: ${AD_GROUP_ADMIN:-Network_Admins}
      AD_GROUP_OPERATOR: ${AD_GROUP_OPERATOR:-Network_Operators}
      AD_GROUP_VIEWER: ${AD_GROUP_VIEWER:-Network_Viewers}
      NETWORK_SIMULATION_MODE: ${NETWORK_SIMULATION_MODE:-false}
      NORNIR_NUM_WORKERS: ${NORNIR_NUM_WORKERS:-20}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_MIN_VERSIONS: ${BACKUP_MIN_VERSIONS:-10}
      SSH_STRICT_HOST_KEY_CHECKING: ${SSH_STRICT_HOST_KEY_CHECKING:-false}
      CELERY_TIMEZONE: ${CELERY_TIMEZONE:-Europe/Istanbul}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-false}
      ALLOWED_ORIGINS: '${ALLOWED_ORIGINS:-["http://localhost:3000","http://localhost:5173","http://localhost:8000"]}'
    volumes:
      - ./backend:/app
      - ${SSH_KNOWN_HOSTS_FILE:-./ssh/known_hosts.example}:/home/omnieye/.ssh/known_hosts:ro
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)); assert data['status']=='healthy'"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - omnieye_network

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: omnieye_celery_worker
    restart: unless-stopped
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=${CELERY_CONCURRENCY:-8}
    environment:
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_USER: ${DB_USER:-omnieye_user}
      DB_PASSWORD: ${DB_PASSWORD:-}
      DB_PASSWORD_FILE: ${DB_PASSWORD_FILE:-}
      DB_NAME: ${DB_NAME:-omnieye_db}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      VAULT_SECRET_KEY: ${VAULT_SECRET_KEY:-}
      VAULT_SECRET_KEY_FILE: ${VAULT_SECRET_KEY_FILE:-}
      SECRET_KEY: ${SECRET_KEY:-}
      SECRET_KEY_FILE: ${SECRET_KEY_FILE:-}
      NETWORK_SIMULATION_MODE: ${NETWORK_SIMULATION_MODE:-false}
      SSH_STRICT_HOST_KEY_CHECKING: ${SSH_STRICT_HOST_KEY_CHECKING:-false}
      NORNIR_NUM_WORKERS: ${NORNIR_NUM_WORKERS:-20}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_MIN_VERSIONS: ${BACKUP_MIN_VERSIONS:-10}
      CELERY_TIMEZONE: ${CELERY_TIMEZONE:-Europe/Istanbul}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    volumes:
      - ./backend:/app
      - ${SSH_KNOWN_HOSTS_FILE:-./ssh/known_hosts.example}:/home/omnieye/.ssh/known_hosts:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - omnieye_network

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: omnieye_celery_beat
    restart: unless-stopped
    command: celery -A app.core.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    environment:
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_USER: ${DB_USER:-omnieye_user}
      DB_PASSWORD: ${DB_PASSWORD:-}
      DB_PASSWORD_FILE: ${DB_PASSWORD_FILE:-}
      DB_NAME: ${DB_NAME:-omnieye_db}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      VAULT_SECRET_KEY: ${VAULT_SECRET_KEY:-}
      VAULT_SECRET_KEY_FILE: ${VAULT_SECRET_KEY_FILE:-}
      SECRET_KEY: ${SECRET_KEY:-}
      SECRET_KEY_FILE: ${SECRET_KEY_FILE:-}
      CELERY_TIMEZONE: ${CELERY_TIMEZONE:-Europe/Istanbul}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_MIN_VERSIONS: ${BACKUP_MIN_VERSIONS:-10}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    volumes:
      - ./backend:/app
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - omnieye_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: omnieye_frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - omnieye_network

volumes:
  mariadb_data:
  redis_data:

networks:
  omnieye_network:
    driver: bridge
