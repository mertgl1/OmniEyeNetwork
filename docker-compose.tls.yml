services:
  frontend:
    ports:
      - "127.0.0.1:${HTTPS_PORT:-443}:443"
      - "127.0.0.1:${HTTP_REDIRECT_PORT:-80}:80"
    volumes:
      - ./frontend/nginx.tls.conf:/etc/nginx/conf.d/default.conf:ro
    secrets:
      - tls_certificate
      - tls_private_key

secrets:
  tls_certificate:
    file: ${TLS_CERTIFICATE_FILE:?Set TLS_CERTIFICATE_FILE}
  tls_private_key:
    file: ${TLS_PRIVATE_KEY_FILE:?Set TLS_PRIVATE_KEY_FILE}
