services:
  mariadb:
    environment:
      MARIADB_ROOT_PASSWORD: ""
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/mariadb_root_password
      MARIADB_PASSWORD: ""
      MARIADB_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - mariadb_root_password
      - db_password

  backend:
    environment:
      DB_PASSWORD: ""
      DB_PASSWORD_FILE: /run/secrets/db_password
      VAULT_SECRET_KEY: ""
      VAULT_SECRET_KEY_FILE: /run/secrets/vault_key
      SECRET_KEY: ""
      SECRET_KEY_FILE: /run/secrets/jwt_secret
    secrets:
      - db_password
      - vault_key
      - jwt_secret

  celery_worker:
    environment:
      DB_PASSWORD: ""
      DB_PASSWORD_FILE: /run/secrets/db_password
      VAULT_SECRET_KEY: ""
      VAULT_SECRET_KEY_FILE: /run/secrets/vault_key
      SECRET_KEY: ""
      SECRET_KEY_FILE: /run/secrets/jwt_secret
    secrets:
      - db_password
      - vault_key
      - jwt_secret

  celery_beat:
    environment:
      DB_PASSWORD: ""
      DB_PASSWORD_FILE: /run/secrets/db_password
      VAULT_SECRET_KEY: ""
      VAULT_SECRET_KEY_FILE: /run/secrets/vault_key
      SECRET_KEY: ""
      SECRET_KEY_FILE: /run/secrets/jwt_secret
    secrets:
      - db_password
      - vault_key
      - jwt_secret

secrets:
  mariadb_root_password:
    file: ${MARIADB_ROOT_PASSWORD_SECRET_FILE:?Set MARIADB_ROOT_PASSWORD_SECRET_FILE}
  db_password:
    file: ${DB_PASSWORD_SECRET_FILE:?Set DB_PASSWORD_SECRET_FILE}
  vault_key:
    file: ${VAULT_SECRET_KEY_SECRET_FILE:?Set VAULT_SECRET_KEY_SECRET_FILE}
  jwt_secret:
    file: ${JWT_SECRET_KEY_SECRET_FILE:?Set JWT_SECRET_KEY_SECRET_FILE}
